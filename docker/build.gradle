/*                                                                                                                                                                
 * build Gradle build script
 */

task prepareDocker(){
    def himsaStageDir = file('himsa/content')
    def otherStageDir = file('other/content')
    doFirst {
        himsaStageDir.deleteDir()
        otherStageDir.deleteDir()
    }
    doLast {
        println "Prepare Docker build for HIMSA/other data provider"
        himsaStageDir.mkdirs()
        otherStageDir.mkdirs()
         // copy all necessary files to  build/docker/ dir
        copy {
            from new File("../org.avatar.himsa.runtime/generated/distributions/executable/launch.jar")
            into himsaStageDir
            rename("launch.jar", "de.avatar.himsa.runtime.jar")
        }
        copy {
            from new File("../org.avatar.other.runtime/generated/distributions/executable/launch.jar")
            into otherStageDir
            rename("launch.jar", "de.avatar.other.runtime.jar")
        }
    }
}

