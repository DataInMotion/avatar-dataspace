/*                                                                                                                                                                
 * build Gradle build script
 */

task prepareDockerHimsa(){
    def stageDir = file('himsa/content')
    doFirst {
        stageDir.deleteDir()
    }
    doLast {
        println "Prepare Docker build for HIMSA data provider"
        stageDir.mkdirs()
         // copy all necessary files to  build/docker/ dir
        copy {
            from new File("../org.avatar.himsa.runtime/generated/distributions/executable/launch_himsa.jar")
            into stageDir
            rename("launch_himsa.jar", "de.avatar.himsa.runtime.jar")
        }
    }
}

